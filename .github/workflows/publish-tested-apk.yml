name: Publish verified Android test installer
on:
  push:
    branches: [gh-pages]
    paths: [.github/workflows/publish-tested-apk.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify approved APK
        run: |
          curl --fail --location --retry 2 --output orbita-0.5.5-demo-cloudtest.apk https://raw.githubusercontent.com/mxmayi/orbita_play/07b01fac98f01b134216c901cdc6d088a9213e3b/downloads/orbita-0.5.5-demo-cloudtest.apk
          echo 'c5f7c2742b30ac6e1256ca210c127f803d970ef2169641f78cce571f92d7c7fd  orbita-0.5.5-demo-cloudtest.apk' | sha256sum --check
      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create android-cloud-0.5.5 orbita-0.5.5-demo-cloudtest.apk --repo mxmayi/orbita_play --target "$GITHUB_SHA" --title 'Órbita 0.5.5 · Seis jugadores y NPC opcionales' --notes 'Compilación 10. Mesas de seis jugadores, NPC opcionales mediante botón, entrada con fichas ajustables y manos automáticas. Actualiza la edición de pruebas online con la misma identidad y firma. Requiere Internet y Android 7 o posterior. 158 pruebas de lógica/servidor, incluidas 10 PostgreSQL, y 40 E2E aprobadas. Servidor en nube y bundle nativo verificados con reconexión, NPC, reparto y liquidación. Prueba en teléfono físico pendiente. SHA256: c5f7c2742b30ac6e1256ca210c127f803d970ef2169641f78cce571f92d7c7fd. Código privado; solo instalador de pruebas.'
