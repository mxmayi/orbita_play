name: Publish verified Android test installer
on:
  push:
    branches: [gh-pages]
    paths: [.github/workflows/publish-tested-apk.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify approved APK
        run: |
          curl --fail --location --retry 2 --output orbita-0.5.3-demo-cloudtest.apk https://raw.githubusercontent.com/mxmayi/orbita_play/513f41a55318bb099b54a4d1a43dbb3196913371/downloads/orbita-0.5.3-demo-cloudtest.apk
          echo '8a60fa6c6c623c677edb548013058cb7a81f54ca7e2a0d1bdd6944fed5f6e2bf  orbita-0.5.3-demo-cloudtest.apk' | sha256sum --check
      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create android-cloud-0.5.3 orbita-0.5.3-demo-cloudtest.apk --repo mxmayi/orbita_play --target "$GITHUB_SHA" --title 'Órbita 0.5.3 · Interfaz móvil' --notes 'Compilación 8. Inicio móvil sin scroll, lobby paginado, mesa vertical, apuestas por porcentaje del bote y menú inferior. Actualiza la edición online 0.5.2 con la misma identidad y firma de pruebas. Requiere Internet y Android 7 o posterior. Dos jugadores; NPC remoto y seis asientos siguen pendientes. 123 pruebas unitarias/servidor y 32 E2E aprobadas; prueba física de esta versión pendiente. SHA256: 8a60fa6c6c623c677edb548013058cb7a81f54ca7e2a0d1bdd6944fed5f6e2bf. Código privado; solo artefactos de prueba.'
